execution:
  defaultExecutor: kotlin-script
  executors:
    - id: kotlin-script
      kind: kotlin-process
      extensions: [".kts"]
      contract: TEXT
places:
  - id: source
    type: STRING
  - id: upperSink
    type: STRING
  - id: lowerSink
    type: STRING
transitions:
  - id: split
    inputs:
      - id: input
        type: STRING
    outputs:
      - id: result
        type: STRING
    logic:
      path: examples/logic/fanout_object.kts
arcs:
  - from: source
    to: split
    toPort: input
  - from: split
    fromPort: result
    to: upperSink
  - from: split
    fromPort: result
    to: lowerSink
initialMarking:
  source:
    - Hello Meshwork
